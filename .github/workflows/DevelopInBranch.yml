name: Develop in a branch

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install and run actionlint
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Downloading actionlint ==="
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

          echo "=== Actionlint version ==="
          ./actionlint -version

          echo "=== Running workflow linting ==="
          ./actionlint -color

      - name: Output context metadata
        env:
          WORKFLOW_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          printf "Workflow triggered in branch '%s'.\n" "$WORKFLOW_REF"
          printf "Workflow triggered by event '%s'.\n" "$EVENT_NAME"
          printf "Workflow triggered by actor '%s'.\n" "$ACTOR"

      - name: Print pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf "Demo PR title is '%s'.\n" "$PR_TITLE"
