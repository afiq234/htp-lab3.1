name: Develop in a branch

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Lint workflow files
        uses: raven-actions/actionlint@v2

      - name: Output context metadata
        env:
          WORKFLOW_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          printf 'Ref: %s\nEvent: %s\nActor: %s\n' \
            "$WORKFLOW_REF" "$EVENT_NAME" "$ACTOR"

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_pattern='^[[:alnum:]][[:alnum:] .,:_()/#!?-]*$'
          if [[ ! $PR_TITLE =~ $title_pattern ]]; then
            echo "::error::PR title must start with a letter or number and use only allowed punctuation."
            exit 1
          fi

          printf 'PR title: %s\n' "$PR_TITLE"
